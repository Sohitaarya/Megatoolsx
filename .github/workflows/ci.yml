# MegaToolsX — CI/CD
#
# Every push/PR: type-check → lint → build → sitemap validation → deploy
# preview (PRs) or production (main) to Cloudflare Pages.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --pretty false

      - name: Lint
        run: npm run lint

      - name: Build (includes sitemap/robots/llms generation)
        run: npm run build

      - name: Validate sitemap index
        run: |
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          grep -q "sitemap-tools-1.xml" dist/sitemap.xml
          echo "sitemap OK"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # 🔥 यहाँ से "Sanitize Cloudflare secrets" वाला Step हटा दिया गया है
      # अब हम Token को सीधे Command में Pass कर रहे हैं

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=megatoolsx --api-token="${{ secrets.CLOUDFLARE_API_TOKEN }}" --account-id="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"

  preview:
    name: Deploy preview (PR)
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # 🔥 यहाँ से भी "Sanitize Cloudflare secrets" वाला Step हटा दिया गया है

      - name: Deploy preview to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=megatoolsx --branch=${{ github.head_ref }} --api-token="${{ secrets.CLOUDFLARE_API_TOKEN }}" --account-id="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"