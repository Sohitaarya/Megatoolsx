# MegaToolsX — CI/CD (Only Verify)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --pretty false

      - name: Lint
        run: npm run lint

      - name: Build (includes sitemap/robots/llms generation)
        run: npm run build

      - name: Validate sitemap index
        run: |
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          grep -q "sitemap-tools-1.xml" dist/sitemap.xml
          echo "sitemap OK"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7